# 共通部品（_partial / _widget）の分類の漏れを PR で止める (#3205)。
#
# 部品を足したときに「部品ギャラリーで見本を出す」か「NOT_SHOWN に理由を書く」の
# どちらかを必ず通す。以前は /doctor/ の台帳に警告として出していたが、
# hexo generate して運営ページを開かないと気づけなかった
# （#2729 で外部リンクの検査を /doctor/ から textlint へ移したのと同じ）。
#
# 呼び出し元が0の部品も止める。
name: partials

on:
  pull_request:
    paths:
      - "themes/future/layout/**"
      - "scripts/**"
      - "ui_partials_lint.mjs"
      - ".github/workflows/partials.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint partials
        run: node ui_partials_lint.mjs
