# CSS の検査を PR で回す。
# 1. 定義の無いカスタムプロパティの参照（#2746 で表の枠が全部消えたのと同じ壊れ方）
# 2. 文字サイズが段から外れていないか (#2971)
# 3. @media の上書きを後ろの規則が打ち消していないか (#3359)
#
# どちらも CLAUDE.md に文章で書くだけでは守れなかったもの。1つ目は表の枠が
# 全ページで消え、2つ目は寄せ終えた直後に別の PR が段の外へ戻した。
#
# paths フィルタにより、CSS を触らない PR ではこのジョブ自体が走らない。
name: css

on:
  pull_request:
    paths:
      - "themes/future/css-src/**"
      - "css.mjs"
      - "css_lint.mjs"
      - "font_size_lint.mjs"
      - "css_media_order_lint.mjs"
      - "scripts/lib/site_css.js"
      - ".github/workflows/css.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # チェックアウトの 1,146MB のうち 1,122MB が source/images (#3246)。
      # sparse だけでは fetch が減らないので blob:none と組で使う
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/source/images/

      # 3つのスクリプトは Node の標準モジュールしか使わないので、npm ci は要らない
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build CSS
        run: node css.mjs

      # 定義の無い var() の参照は宣言ごと無効になり、画面を見るまで気づけない
      - name: Check CSS for silently dropped declarations
        run: node css_lint.mjs

      - name: Check font-size scale
        run: node font_size_lint.mjs

      - name: Check @media overrides are not cancelled
        run: node css_media_order_lint.mjs
