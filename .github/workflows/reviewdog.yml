name: Auto review with reviewdog

on:
  - pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  textlint:
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      # チェックアウトの 1,146MB のうち 1,122MB が source/images (#3246)。
      # sparse だけでは fetch が減らないので blob:none と組で使う
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/source/images/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup reviewdog
        # https://www.wiz.io/blog/new-github-action-supply-chain-attack-reviewdog-action-setup の対策のため、タグではなくハッシュ値を直接指定する
        # https://github.com/reviewdog/action-setup/commit/3f401fe1d58fe77e10d665ab713057375e39b887
        uses: reviewdog/action-setup@3f401fe1d58fe77e10d665ab713057375e39b887
        with:
          reviewdog_version: latest

      - name: Fetch base branch
        run: git fetch origin ${{github.base_ref}} --depth=1

      # 画像ファイルを開くローカルルールは no-img-ratio-mismatch だけで、
      # そのルールは存在しないファイルを黙って飛ばす。#3246 で画像を働き場所から
      # 外したので、変更された記事が参照するディレクトリを戻さないと #2643 の
      # 検査が静かに消える。blob:none なので戻した分の blob だけが取得される
      - name: Restore images referenced by changed posts
        run: |
          CHANGED="${{runner.temp}}/changed-posts"
          git diff -z --diff-filter=ACMR --name-only origin/${{github.base_ref}} HEAD -- 'source/_posts/*.md' > "$CHANGED"
          # ディレクトリ名は全1,467件が ASCII なので glob のメタ文字が混ざらない。
          # ファイル名の側は1,274件が日本語などを含むため、末尾の / までで切る
          DIRS=$(xargs -0 -r grep -hoE '/images/[A-Za-z0-9._/-]*/' < "$CHANGED" \
            | sed 's|^|/source|' | sort -u)
          if [ -z "$DIRS" ]; then
            echo "参照している画像が無いためスキップします"
            exit 0
          fi
          echo "$DIRS"
          echo "$DIRS" | xargs -r git sparse-checkout add

      - name: Run textlint with reviewdog
        run: |
          # Markdown と EJS の変更が無い PR では、textlint も reviewdog も実行しない。
          # textlint は対象0件だと使い方の説明を標準出力に出し、reviewdog は
          # 空の標準入力を checkstyle として解析できずに落ちるため。
          # EJS を見るのは外部リンクの明示チェック（#2346 / #2652）。
          # textlint-plugin-ejs が <a href> だけを Link ノードにして渡す
          if [ -z "$(git diff --diff-filter=ACMR --name-only origin/${{github.base_ref}} HEAD -- '*.md' '*.ejs')" ]; then
            echo "Markdown・EJS の変更が無いためスキップします"
            exit 0
          fi

          git diff -z --diff-filter=ACMR --name-only origin/${{github.base_ref}} HEAD -- '*.md' '*.ejs' \
            | xargs -0 -r npx --no-install textlint --fix || true
          git diff -z --diff-filter=ACMR --name-only origin/${{github.base_ref}} HEAD -- '*.md' '*.ejs' \
            | xargs -0 -r npx --no-install textlint -f checkstyle \
            | reviewdog -f=checkstyle \
              -name=textlint \
              -reporter=github-pr-review \
              -filter-mode=added \
              -fail-on-error=false \
              -level=warning

          TMPFILE=$(mktemp -p ${{runner.temp}})
          git diff > "${TMPFILE}"
          git stash -u && git stash drop || true

          reviewdog \
            -f=diff \
            -f.diff.strip=1 \
            -name=textlint-fix \
            -reporter=github-pr-review \
            -filter-mode=diff_context \
            -level=warning < "${TMPFILE}"
