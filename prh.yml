# 表記ゆれの辞書。textlint-rule-prh が読む。
#
# 以前は spellcheck-tech-word（WEB+DB PRESS 用語統一ルール）を使っていたが、
# 個別の変換を止める手段が無く、誤検知のたびに allowlist へ単語を足す運用に
# なっていた。必要な変換だけをここに書く形に変えている（#2184）。
#
# 追加するときは、その語が URL・ファイルパス・製品名の一部として本文に
# 出てこないかを先に確認する。prh はコードブロックとインラインコードは
# 見ないが、地の文に書かれた URL やパスには当たる。
version: 1
rules:
  - expected: インターフェース
    patterns:
      - インタフェース

  - expected: プレフィックス
    patterns:
      - プリフィックス

  # 「Web」を付けなくても意味が通る
  - expected: ブラウザ
    patterns:
      - Webブラウザ
