# HACK TO THE FUTURE の歴代コンテスト（#2345）。
# /specials/httf/ がここを読む。新しい回が始まったら先頭に1年ぶん足す。
# 年1回の更新をここだけで済ませる。
#
# 表示名は「HACK TO THE FUTURE <year>」で、year から組み立てる。
#
# **回の年は開催年の翌年になる。** 2026年の回は2025年11月に開かれている。
# 先頭の year が今年より先の間、ホームの「特集」枠に HTTF が出る（#2892）。
# 回の年が今年に追いつくとオフシーズンになり、枠は連載とガイドラインに譲る。
#
# 2023年以前は予選・本選（本選はオープンコンテスト）の2本立てで、
# final にそのリンクを持つ。2024年以降は1本なので meta にコンテスト名を書く。
