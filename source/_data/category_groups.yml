# カテゴリの群（#2908）。18件を一列に並べると、読者は行き先を選ぶのに
# 最大18行を走査することになる。ヘッダーのドロップダウン・サイドバー・
# /categories/ の3箇所で同じ群に束ねて出し、走査を2〜6行に落とす。
#
# **群の並びはこのファイルの順序**。群の中の並びは category_groups() が
# 累計の多い順で決める（#2959 の規則のまま）。
#
# 線引き:
# - 「基盤」は CLAUDE.md が境界を定義している基盤系4カテゴリ（#2057 / #2461）
#   ちょうどにする。書き手が迷う4つが同じ群に並ぶので、読者も同じ場所で見比べられる
# - 「セキュリティ」を基盤に入れずに分けるのは、上の4つの定義を崩さないため
# - 登録が漏れたカテゴリはビルドの警告が出て、末尾の「その他」の群に落ちる
開発:
  - Programming
  - Frontend
  - Mobile
  - IoT
  - VR
基盤:
  - DevOps
  - Cloud
  - Infrastructure
  - IaC
データ:
