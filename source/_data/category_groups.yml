# カテゴリの群（#2908）。18件を一列に並べると、読者は行き先を選ぶのに
# 最大18行を走査することになる。ヘッダーのドロップダウン・サイドバー・
# /categories/ の3箇所で同じ群に束ねて出し、走査を2〜6行に落とす。
#
# このファイルが持つのは所属だけ。群の並び（所属カテゴリの累計本数の合計が多い順）も
# 群の中の並びも category_groups() が決める。並びの規則を1箇所に保つため（#2959）、
# ここに書いた順序は表示に影響しない。
#
# 線引き:
# - 「基盤・運用」は CLAUDE.md が境界を定義している基盤系4カテゴリ（#2057 / #2461）
#   ちょうどにする。書き手が迷う4つが同じ群に並ぶので、読者も同じ場所で見比べられる
# - 「セキュリティ」を基盤・運用に入れずに分けるのは、上の4つの定義を崩さないため
# - 登録が漏れたカテゴリはビルドの警告が出て「その他」の群に落ちる
開発:
  - Programming
  - Frontend
  - Mobile
