# カテゴリの群（#2908）。18件を一列に並べると、読者は行き先を選ぶのに
# 最大18行を走査することになる。ヘッダーのドロップダウン・サイドバー・
# /categories/ の3箇所で同じ群に束ねて出し、走査を2〜6行に落とす。
#
# **群の並びはこのファイルの順序**。群の中の並びは category_groups() が
# 累計の多い順で決める（#2959 の規則のまま）。
#
# 線引き:
# - 「基盤」は**動かすもの**の群。CLAUDE.md が境界を定義している基盤系4カテゴリ
#   （#2057 / #2461）に DB を足した5つ。DB の70本を読むと71%が「ミドルウェアを
#   動かす」記事（PostgreSQL の新機能・EXPLAIN・DynamoDB のコスト・Oracle からの移行）で、
#   CLAUDE.md の「ネットワーク・OS・ミドルウェアは Infrastructure」と同じ性格 (#3006)。
#   **CLAUDE.md 側の4カテゴリの定義は動かさない。** あれは書き手が「記事にどのカテゴリを
#   付けるか」の線で、群は読者が「どこを探すか」。役が違うので片方だけ広げてよい
# - 「セキュリティ」を基盤に入れずに分けるのは、上の4つの定義を崩さないため
# - 登録が漏れたカテゴリはビルドの警告が出て、末尾の「その他」の群に落ちる
開発:
  - Programming
  - Frontend
  - Mobile
  - IoT
  - VR
基盤:
  - DevOps
  - Cloud
  - Infrastructure
  - IaC
  - DB
# 群名は「データ」から改めた (#3006)。古典的な機械学習も AI と呼ばれてきたので、
# DataScience（モデル・データそのもの）と AIDD（生成AI を道具として使う）の
# 両方を束ねる名前として成り立つ
AI:
  - DataScience
  - AIDD
  - DataEngineering
セキュリティ:
  - Security
  - 認証認可
ビジネス:
  - Culture
  - Business
  - Management
