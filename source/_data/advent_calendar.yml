# フューチャーの Qiita アドベントカレンダー（#2464）。
# サイドバーのウィジェットと /specials/advent-calendar/ の両方がここを読む。
# 新しい回が始まったら先頭に1年ぶん足す。年1回の更新をここだけで済ませる。
#
# name はカレンダーの表示名。2017年までは「フューチャーアーキテクト」で、
# 社名に合わせて2018年から「フューチャー」になっている。
#
# series2 は別URLで開いたシリーズ2。Qiita は途中から複数シリーズを
# 同一URLのタブに変えたため、別URLを持つのは2019年だけ
# （2015〜2025 × future / future2 / future3 を実測して確認）。
