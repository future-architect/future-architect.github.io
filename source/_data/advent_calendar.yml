# フューチャーの Qiita アドベントカレンダー（#2464）。
# /specials/advent-calendar/ がここを読む。
# 新しい回が始まったら先頭に1年ぶん足す。年1回の更新をここだけで済ませる。
# 先頭の year が今年と一致する間、ホームの特設パネルにカレンダーが出る（#2880）。
#
# name はカレンダーの表示名。2017年までは「フューチャーアーキテクト」で、
# 社名に合わせて2018年から「フューチャー」になっている。
#
# series2 は別URLで開いたシリーズ2。Qiita は途中から複数シリーズを
# 同一URLのタブに変えたため、別URLを持つのは2019年だけ
# （2015〜2025 × future / future2 / future3 を実測して確認）。
#
# posts はカレンダーにこのブログの記事が登録されていた枠。全12ページの
# エントリを機械で読んで拾った8本で、値は記事ID（/articles/<ID>/）。
# **公開年で引けない。** 20230105a は2022年のカレンダーの14日目だが、
# 公開が遅れて2023年1月に出ている。登録された年が正なので、ここに持つ。
# 記事側にはタグ「アドベントカレンダー」を付けてある（タグは記事の集合、
# ここは年との対応）。
