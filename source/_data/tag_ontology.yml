# タグの親子オントロジー (#2292)
#
# broader = そのタグより広い概念。複数可。親を持たないタグは broader: [] で
# 「検討済みの根」を明示する（未登録＝未検討、と区別するため）。
#
# 目的は執筆者のタグ付けコストの削減。記事には具体タグ（daisyUI）だけ付ければよく、
# 抽象タグ（CSS / IaC / NoSQL 等）を付けるかの判断は不要。抽象への接続はこの
# ファイルが肩代わりし、関連記事の計算（scripts/related_posts.js）が broader を
# 辿って「タグを共有しないが同系統の記事」を拾う。
#
# 辺を書く基準（#2292 の議論で確定）:
# - 「A の記事に B タグを打つのは冗長で打ちたくない」と筆者が感じる自明な包含だけ書く
#   （TypeScript 記事に JavaScript、OpenAPI 記事に WebAPI を打ちたくない、の肩代わり）
# - 文脈次第の関係は書かない。Swift と iOS のように記事によって成り立たない関係は、
#   筆者が必要なとき自分で直接タグを打って表明する
# - 迷ったら書かない。誤った親は関連記事を汚すが、無い親は何も壊さない
#
# 共起や名前の形（Go1.26/Go1.27）から機械的に導出できる関係は related_tags.js が
# 担っており、ここには書き写さない。
#
# 値は実在するタグでなくてもよい（イベント / OS など、照合にだけ使う概念で可）。
# ただし参照される概念は必ずこのファイルにノードとして登録する。
# 整合性チェックは .claude/skills/tag-maintenance/check.mjs（タグ整理のスキル参照）。

