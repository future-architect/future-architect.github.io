# 連載の系統（バージョン・年で続いていく連載の前後関係）の例外定義 (#2383)
#
# 系統は「数字の連続を除いた名前が同じ」連載を数字の数値順に繋ぐ命名規則で
# 自動導出する（scripts/lib/series.js。Go1.26リリース → Go1.27リリース、
# 春の入門祭り2025 → 春の入門祭り2026）。このファイルには規則で繋がらない
# 継続だけを書く。
#
# 改名などで名前が繋がらない継続（前の連載側に次を書く）:
#   古い連載名:
#     next: 新しい連載名
#
# 名前が偶然同じ形になるだけで、系統として繋ぎたくない連載:
#   連載名:
#     standalone: true
#
# 2026年から連載名を「夏休み自由研究」に揃えた（タグ・年間計画の表記が元からこちら）
夏の自由研究2025:
  next: 夏休み自由研究2026
