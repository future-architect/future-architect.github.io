# Best Blogger of the Year（べすぶろ）の受賞記録（#2149）。
# 社外に影響を与えた記事を執筆した人を年1回表彰する取り組み（2020年〜、
# 未来報と共催）。ここに載せるのは技術ブログ部門のみ（未来報部門は別媒体）。
# 表彰後にここへ1行ずつ追記する。
#
# 3回受賞で殿堂入り（公式ルール「累計3回受賞した方は殿堂入りとし、称える」）。
# 殿堂入りはここに書かず、表示側（scripts/awards.js）が受賞回数から導出する
# （記録と称号の二重管理をしない）。
#
# author は記事フロントマターの author と同じ表記にする（著者ページとの結合キー）。
#
# article は代表記事のID（URL の /articles/<ID>/ の部分）。書くとその記事に
# 受賞バッジが出る (#2422)。表彰は人に贈られるもので、複数執筆者は代表記事1本を
# 選ぶ運用なので任意項目にしている。2020年は記録に記事の指定が無いため空。
#
# 出典: 社内 Future's Chronicle の各年記録（2020〜2024）、
#       べすぶろ2025の社内公開記事（2025）
