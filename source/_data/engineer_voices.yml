# エンジニアの声 (#2913)。/specials/engineers/ の「エンジニアの声」節が読む。
# 名前は source/_posts のフロントマターの author と同じ表記にする。著者ページへの
# 導線と累計本数をこの名前で引くので、表記が違うと行き先が 404 になる。
# 1要素が1段落。HTML は書かない（プレーンテキストのまま <p> に入る）。
# 所属・自己紹介は _profile.yml の about が持つので、ここには書かない。
#
# 書くのは技術の進め方で大事にしていること。働きやすさ・向いている人・環境の
# 魅力は採用ページ側の話なので、ここには置かない
- author: 真野隼記
  paragraphs:
    - 大事にしているのは、中立の立場からお客様にとって本当に最適なものを選ぶことです。技術の選定も、構築の仕方も、設計も、既存の制約や組織の慣習に引っ張られず、そのときのお客様の事情とプロジェクトの特性に合わせてゼロベースから組み立てます。
    - そのぶん、一人ひとりが自律的に判断することが前提になります。決まった型をなぞるのではなく、大きなスケールであるべき姿から考える。アーキテクトとしての審美眼が磨かれるのはここだと思っています。
    - 案件ごとに違うものを触っていくので、トラブルや技術的に難しい局面にぶつかることも多くなります。そこを解きほぐせる、ある程度特化した知識が組織の中で価値を持っています。
