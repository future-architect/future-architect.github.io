# 現場の声 (#2913)。/specials/engineers/ の「現場の声」節が読む。
# 名前は source/_posts のフロントマターの author と同じ表記にする。著者ページへの
# 導線と累計本数をこの名前で引くので、表記が違うと行き先が 404 になる。
# 1要素が1段落。HTML は書かない（プレーンテキストのまま <p> に入る）。
# 所属・自己紹介は _profile.yml の about が持つので、ここには書かない。
#
# 書くのは技術の進め方で大事にしていること。働きやすさ・向いている人・環境の
# 魅力は採用ページ側の話なので、ここには置かない
- author: 真野隼記
  paragraphs:
    - 技術的に大事にしているのは、「フューチャー」という名前だけあって、5年先、10年経っても「これが新しくて一番いい」と言えるものを生み出していくことです。
    - 厳しいスケジュールや体制で間に合わせようとすると、慣れた技術で堅く作るのがいちばんリスクが低くなります。ただ、そのシステムが将来にわたって価値を生み出せるか、運用しやすいかまで見通すと、ゼロベースでフラットにアーキテクチャを考える必要があります。
    - もちろんバランスは要ります。技術のトレンドを押さえるだけでバランスを欠いたものを作ってもいけないので、未来を見据えたうえでいま何を選ぶか、そこを引き受けることだと思っています。
