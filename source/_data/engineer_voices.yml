# エンジニアの声 (#2913)。/specials/engineers/ の「エンジニアの声」節が読む。
# 名前は source/_posts のフロントマターの author と同じ表記にする。著者ページへの
# 導線と累計本数をこの名前で引くので、表記が違うと行き先が 404 になる。
# 1要素が1段落。HTML は書かない（プレーンテキストのまま <p> に入る）。
# 所属・自己紹介は _profile.yml の about が持つので、ここには書かない
- author: 真野隼記
  paragraphs:
    - フューチャーのエンジニアリングのいいところは、中立の立場からお客様にとって最適なものを提案できることだと思っています。技術の選定も、構築の仕方も、設計も、既存の制約や組織の慣習に引っ張られず、そのときのお客様の事情とプロジェクトの特性に合わせてゼロベースから組み立てられます。ここが一番の醍醐味です。
    - それゆえに、一人ひとりの興味は多種多様で、プロジェクトも採用技術もバリエーションに満ちています。フューチャーのどこかに自分に合う環境があるはずで、わくわくするような現場がたくさんあると思っています。
    - コンサルタントなので自律的に動くことも重視されます。そのぶん自由度が高く、自分のやりたいことを後押ししてもらえる環境です。技術戦略としては、アーキテクトとしての審美眼が相当に磨かれる場所だと思うので、大きなスケールであるべき姿を考えたい人には向いています。
    - 一方で、みんなが違うものを触っていくぶん、トラブルや技術的に難しい局面にぶつかることも多くなります。そこを解決できる、ある程度特化したスペシャリストが活躍できる幅も大きいと思っています。
