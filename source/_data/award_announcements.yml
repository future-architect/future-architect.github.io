# Best Blogger of the Year の受賞発表記事（#2562）。年 -> 記事ID。
#
# 記事に出る受賞バッジ（scripts/awards.js / _partial/article.ejs）から、
# その年の選出理由が書かれた記事へ飛ばすために使う。
#
# 受賞記録そのものは awards.yml。こちらを別ファイルにしているのは、
# 発表が年ごとの単位で、1本の記事が複数年をまとめて扱うことがあるため
# （20251226a が 2022〜2025 の4年分を発表している）。awards.yml の行ごとに
# 持たせると同じ記事IDが15行に散る。
#
# 2020年は発表記事が無い（社内記録のみ）。書かなければバッジはリンクにならない。
2021: 20220121a
2022: 20251226a
2023: 20251226a
2024: 20251226a
2025: 20251226a
