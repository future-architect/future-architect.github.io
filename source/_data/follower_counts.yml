# フッターに出す X と GitHub のフォロワー数（#2841）。
#
# **github は手で書き換えない。** update-cache.yml が毎日（9:00 JST）
# update_follower_counts.mjs を回して count と as_of の2行を上書きする。
# 認証なしの https://api.github.com/users/future-architect で取れる
# （organization でも /users/{login} が followers を返す）。
#
# **x は手打ち。** フォロワー数を返す API が有料なので取りに行けない。
# 更新したら as_of も一緒に直す。
#
# **as_of（数えた日）は必ず入れる。** いつ時点かが分からない数字は出さない。
# title 属性で読者にも見せている。日付を文字列で書くのは、日付として
# 解釈させるとタイムゾーンで前日にずれることがあるため。
x:
  count: 2337
  as_of: '2026-08-27'
github:
  count: 186
  as_of: '2026-09-02'
