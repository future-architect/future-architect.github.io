# フッターに出す X と GitHub のフォロワー数（#2841）。**手で更新する。**
#
# Feedly の購読者数は update-cache.yml が毎日 API から取ってくるが、この2つは
# 同じようには取れないので手打ちにしている。
#   - X: フォロワー数を返す API が有料
#   - GitHub: https://api.github.com/users/future-architect の followers で
#     公開のまま取れるので、自動化するならこちらが先。取れるようになったら
#     この項目を消して sns_count_cache.json と同じ流儀に移す
#
# **as_of（数えた日）を必ず一緒に書く。** 手打ちの数字は放っておくと古くなるので、
# 「いつ時点か」を title 属性で読者にも見せる。文字列で書くのは、日付として
# 解釈させるとタイムゾーンで前日にずれることがあるため。
x:
  count: 2337
  as_of: '2026-08-27'
github:
  count: 185
  as_of: '2026-08-27'
