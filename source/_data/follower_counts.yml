# フッターのアイコンに添える数（#2841 / #3193）。どれも「その行き先で自分たちを
# フォローしている人の数」で、投稿数のような量は入れない。
#
# **github と youtube は手で書き換えない。** update-cache.yml が毎日（9:00 JST）
# update_follower_counts.mjs を回して count と as_of の2行を上書きする。
# GitHub は認証なしの https://api.github.com/users/future-architect で取れる
# （organization でも /users/{login} が followers を返す）。
# YouTube はチャンネルページの JSON-LD（interactionStatistic の FollowAction）から
# 取る。robots.txt は /channel/ を許可している。表示言語で変わらない値なので、
# 「チャンネル登録者数 162人」の文言ではなくこちらを読む。
#
# **x と connpass は手打ち。** X はフォロワー数を返す API が有料。connpass は
# 利用規約が「API 以外の方法でのクローリング・スクレイピング」を禁じていて、
# robots.txt も User-agent: * を Disallow: / にしている。member_users_count を返す
# API v2 はあるが、利用申請して発行されるキーが要る。更新したら as_of も一緒に直す。
#
# **as_of（数えた日）は必ず入れる。** いつ時点かが分からない数字は出さない。
# title 属性で読者にも見せている。日付を文字列で書くのは、日付として
# 解釈させるとタイムゾーンで前日にずれることがあるため。
x:
  count: 2337
  as_of: '2026-08-27'
github:
  count: 186
  as_of: '2026-09-05'
connpass:
  count: 1484
  as_of: '2026-09-03'
youtube:
  count: 162
  as_of: '2026-09-05'
