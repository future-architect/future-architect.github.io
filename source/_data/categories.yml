# カテゴリの一言説明（#2405）。カテゴリ個別ページの見出し下と
# /categories/ 一覧に出す。
#
# 書き方のルール:
# - 「このカテゴリは何の置き場か」の役割定義を1文で。トピックの列挙はしない
#   （具体的な技術名は隣に並ぶ「よく使われるタグ」が担う）
# - 略語のカテゴリは正式名称を先頭に添える（IaC / AIDD）
# - 境界が紛らわしいカテゴリは CLAUDE.md の境界定義（#2057 / #2293）と矛盾させない
# - 説明の漏れ・カテゴリ名の食い違いは /doctor/ が検出する
Programming: 言語や実装技法など、コードを書くことそのものを主題にした記事
Infrastructure: クラウド・ネットワーク・OS といった、システムの基盤そのものを設計・構築する記事
Frontend: Web ブラウザで動く画面まわりの開発とテストの記事
DevOps: CI/CD・コンテナ・監視など、作ったシステムを回し続ける仕組みの記事
Culture: イベント・勉強会・ブログ運営など、フューチャーの技術文化と人の記事
DataScience: 機械学習モデルやデータ分析そのもの（研究・学会発表を含む）が主題の記事
DB: データベースの設計・チューニング・運用の記事
Mobile: スマートフォンアプリ開発の記事
IaC: Infrastructure as Code。サーバーやネットワークの構成をコードで書いて管理する記事
IoT: センサーやデバイスで現実世界とシステムをつなぐ技術の記事
Business: 業界ドメインの知識やコンサルティングの現場など、ビジネス寄りの記事
DataEngineering: データを集めて流し、活用できる形に整える基盤の記事
Management: チーム運営や仕事の進め方など、マネジメントの記事
AIDD: AI-Driven Development。生成AI・LLM を道具として使う開発の記事
Security: 攻撃からシステムを守る技術と運用の記事
認証認可: 「誰であるか」と「何をしてよいか」を扱う、ログインと権限制御の記事
VR: VR / AR デバイスと空間コンピューティングの記事
