# カテゴリの一言説明（#2405）。カテゴリ個別ページの見出し下と
# /categories/ 一覧に出す。
#
# 書き方のルール:
# - 「このカテゴリは何の置き場か」の役割定義を、ですます調の1文で。
#   トピックの列挙はしない（具体的な技術名は隣に並ぶ「よく使われるタグ」が担う）
# - 略語のカテゴリは正式名称を先頭に添える（IaC / AIDD）
# - 境界が紛らわしいカテゴリは CLAUDE.md の境界定義（#2057 / #2293）と矛盾させない
# - 説明の漏れ・カテゴリ名の食い違いは /doctor/ が検出する
Programming: 言語や実装技法など、コードを書くことそのものを主題にします
Infrastructure: クラウド・ネットワーク・OS といった、システムの基盤そのものの設計・構築を扱います
Frontend: Web ブラウザで動く画面まわりの開発とテストを扱います
DevOps: CI/CD・コンテナ・監視など、作ったシステムを回し続ける仕組みを扱います
Culture: イベント・勉強会・ブログ運営など、フューチャーの技術文化と人を伝えます
DataScience: 機械学習モデルやデータ分析そのもの（研究・学会発表を含む）を主題にします
DB: データベースの設計・チューニング・運用を扱います
Mobile: スマートフォンアプリの開発を扱います
IaC: Infrastructure as Code。サーバーやネットワークの構成をコードで書いて管理する話を扱います
IoT: センサーやデバイスで現実世界とシステムをつなぐ技術を扱います
Business: 業界ドメインの知識やコンサルティングの現場など、ビジネス寄りの話題を扱います
DataEngineering: データを集めて流し、活用できる形に整える基盤を扱います
Management: チーム運営や仕事の進め方など、マネジメントを扱います
AIDD: AI-Driven Development。生成AI・LLM を道具として使う開発を扱います
Security: 攻撃からシステムを守る技術と運用を扱います
認証認可: ログインや権限制御など、「誰であるか」と「何をしてよいか」を主題にします
VR: VR / AR デバイスと空間コンピューティングを扱います
