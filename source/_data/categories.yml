# カテゴリの一言説明（#2405）。カテゴリ個別ページの見出し下と
# /categories/ 一覧に出す。
#
# 書き方のルール:
# - 「このカテゴリは何の置き場か」の役割定義を、ですます調の1文（句点で終える）で。
#   トピックの列挙はしない（具体的な技術名は隣に並ぶ「よく使われるタグ」が担う）
# - 略語のカテゴリは正式名称を先頭に添える（IaC / AIDD）
# - 境界が紛らわしいカテゴリは CLAUDE.md の境界定義（#2057 / #2293）と矛盾させない
# - 説明の漏れは textlint の no-invalid-post-taxonomy が止める（未登録の語を
#   categories に書いた記事で落ちる）。/doctor/ の両方向の照合は廃止した (#2706)
Programming: 言語や実装技法などを主題とします。
Cloud: クラウドのマネージドサービスそのものの使い方と設計を扱います。
Infrastructure: ネットワーク・OS・ミドルウェアといった、システムの基盤そのものを扱います。
Frontend: 主にブラウザで動作するWebフロントエンドを扱います。
DevOps: CI/CD・コンテナ・監視など、作ったシステムを回し続ける仕組みを扱います。
Culture: フューチャーの技術文化と人を伝えます。
DataScience: 機械学習モデルやデータ分析そのものを主題にします。
DB: データベース関係の技術を扱います。
Mobile: スマートフォンアプリの開発を扱います。
IaC: Infrastructure as Codeについて扱います。
IoT: センサーやデバイスで現実世界とシステムをつなぐ技術を扱います。
Business: 業界ドメインの知識やコンサルティングの現場など、ビジネス寄りの話題を扱います。
DataEngineering: データを集めて流し、活用できる形に整える基盤を扱います。
Management: チーム運営や仕事の進め方など、マネジメントを扱います。
AIDD: AI-Driven Developmentについて扱います。
Security: 攻撃からシステムを守る技術と運用を扱います。
認証認可: ログインや権限制御など、「誰であるか」と「何をしてよいか」を主題とします。
VR: VR / AR デバイスと空間コンピューティングを扱います。
