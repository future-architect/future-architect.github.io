# mermaid 図のSVG生成用の kroki セルフホスト（#1955、ローカル専用。CIでは使わない）。
# 公開 kroki.io はレート制限で 403 が返るためセルフホストする。
# 起動・利用は mermaid_svg.mjs が行う。手動なら:
#   docker compose -f mermaid_svg.compose.yml up -d
# バージョンは2つ揃えて上げる（このタグの mermaid は 11.16.0）。
# 上げると全図のSVGが再生成対象になるわけではないが、既存SVGはコミット済みの
# ものが使われ続けるので、描画差異は新規生成分にしか現れない
name: blog-kroki
services:
  kroki:
    image: yuzutech/kroki:0.32.0
    environment:
      KROKI_MERMAID_HOST: mermaid
    ports:
      - "127.0.0.1:8006:8000"
    depends_on:
      - mermaid
  mermaid:
    image: yuzutech/kroki-mermaid:0.32.0
