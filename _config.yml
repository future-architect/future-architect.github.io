# Hexo Configuration
## Docs: http://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 'フューチャー技術ブログ'
subtitle: Future Tech Blog
description: フューチャーの開発者による公式技術ブログです。業務で利用している技術を幅広く紹介します。
author:
language: ja
timezone: Asia/Tokyo

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://future-architect.github.io
root: /
permalink_defaults:
  lang_dir: ""
permalink: articles/:lang_dir:year:month:day:postid/

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: articles
author_dir: authors
techcast_dir: techcasts
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Authors
author_generator:
  per_page: 25
  url_map:

category_generator:
  per_page: 25
  order_by: -date

tag_generator:
  per_page: 25
  order_by: -date

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link.enable: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

highlight:
  enable: true
  auto_detect: false
  line_number: false
  # line_threshold: 5 # not work?
  # wrap: true
  # hljs: false

# Markdown
marked:
  # メールアドレスの難読化。10進と16進のどちらで書くかを Math.random() で
  # 選ぶため、有効にするとビルドが決定的でなくなる（#2055）
  mangle: false

# Category & Tag
default_category: uncategorized
category_map:
# 表示は日本語、URL スラッグは英語のままにしたいタグ (#2203)。
# 記事側のタグは日本語表記で書く
tag_map:
  ネットワーク: Network

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
index_generator:
  path: ''
  per_page: 25
  pagination_dir: page

per_page: 0
pagination_dir: page

## Themes: http://hexo.io/themes/
theme: future

# Deployment
## Docs: http://hexo.io/docs/deployment.html
deploy:
  type: git
  repo: git@github.com:future-architect/future-architect.github.io.git
  branch: master

# RSS/Atom フィード。scripts/feed.js が /atom.xml /rss2.xml を生成する（#1278）
feed:
  limit: 25
  icon: feed_icon.png

plugins:
  - hexo-footnotes

server:
  cache: false
  serveStatic:
    cacheControl: false
    etag: false
    maxAge: -1

# リダイレクト設定（旧URLから新URLへ）
# 例えば、名称が変更されたタグなどに利用
alias:
  # カテゴリとタグの重複を解消
  tags/DB/: categories/DB/
  tags/Security: categories/Security/
  tags/IoT: categories/IoT/
  tags/モバイルアプリ: categories/Mobile/ # Mobileカテゴリの新設対応
  tags/フロントエンド: categories/Frontend/ # Frontendカテゴリの新設対応
  tags/VR: categories/VR/ # VRカテゴリと重複排除
  tags/データエンジニアリング: categories/DataEngineering/ # DataEngineeringカテゴリの新設対応
  tags/マネジメント: categories/Management/
  tags/AI駆動開発/: categories/AIDD/ # AIDDカテゴリと同義
  tags/IaC/: categories/IaC/ # IaCカテゴリと重複排除 (#2291)
  tags/GoTips連載/: articles/20200518/ # series "Go Tips" に移行 (#2303)
  tags/インフラ入門/: articles/20170109/ # series "インフラ入門" に移行 (#2303)
  tags/サブスクリプション/: tags/Zuora/ # Zuora が分かればサブスクリプションSaaSと分かる (#2377)

  # 特設ページを /specials/ 配下へ移設 (#2344)
  guidelines/: specials/guidelines/

    # カテゴリの変更
  categories/Design: tags/UI-UX/
  categories/AI/: categories/AIDD/ # AIカテゴリをAIDD（AI駆動開発）に統合

  # 名寄せなど
  tags/GCP/: tags/GoogleCloud/
  tags/画像認識/: tags/画像処理/
  tags/icon: categories/アイコン/

  # 同義タグの統合
  tags/自然言語処理/: tags/NLP/
  tags/WSL2/: tags/WSL/
  tags/性能テスト/: tags/性能検証/
  tags/論文解説/: tags/論文紹介/
  tags/SQLLite/: tags/SQLite/ # 誤記の修正
  tags/OpenCensus/: tags/OpenTelemetry/ # OpenCensus は OpenTelemetry に統合された旧規格
  tags/ClaudeCode/: tags/Claude/
  tags/NoSQL/: tags/Cassandra/
  tags/Grafana-Alloy/: tags/Grafana/ # タグ名「Grafana Alloy」のスラッグ
  tags/Zuora/: tags/サブスクリプション/
  tags/TechBlog/: tags/運営/ # ブログ論一般と当ブログ運営の使い分けを説明できず統合 (#2292)
  tags/新人向け/: tags/初心者向け/ # 同義のため統合 (#2292)
  tags/コンテスト/: tags/参加レポート/ # 参加系タグの被りを解消 (#2334)
  tags/参戦記/: tags/参加レポート/ # 同上 (#2334)
  tags/マイコン/: tags/電子工作/ # 3記事で語彙過多のため近縁タグへ (#2303)
  tags/AI/: tags/生成AI/ # 語が広すぎて絞り込みに機能しない。現代の検索意図の多数派へ (#2382)

  # 1記事しかなく、タグ名がタイトルに含まれるため復元が容易なタグ。
  # 一覧のノイズを減らすため廃止し、タグURLは元記事へ転送する。
  # 将来そのタグを復活させる場合は、この行を必ず削除すること（タグページと衝突する）
  tags/Elixir/: articles/20170414/
  tags/TFLint/: articles/20211223a/
  tags/wasmCloud/: articles/20230619b/
